<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>USA IP Database</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="card">

            <div class="header">
                <div class="icon">
                    IP
                </div>

                <h1>USA IP Database</h1>

                <p>
                    Add a USA IP address to the database
                </p>
            </div>


            <form id="uploadForm">

                <div class="form-group">

                    <label for="ipAddress">
                        IP Address
                    </label>

                    <input
                        type="text"
                        id="ipAddress"
                        name="ip_address"
                        placeholder="Enter IP address"
                        autocomplete="off"
                        spellcheck="false"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="uploadButton"
                >
                    <span id="buttonText">Upload IP</span>

                    <span
                        id="buttonLoader"
                        class="loader hidden"
                    ></span>
                </button>

            </form>


            <div
                id="message"
                class="message hidden"
                role="alert"
            ></div>

        </section>

    </main>


    <script src="app.js"></script>

</body>
</html>
