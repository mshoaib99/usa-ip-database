<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IP Database</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="card">

            <div class="icon">
                IP
            </div>

            <h1>Please Add Your IP To Check Your Details</h1>

            <p class="subtitle">
                Enter your IP address below and click Upload IP.
            </p>

            <form id="ipForm">

                <div class="input-group">

                    <label for="ipAddress">
                        IP Address
                    </label>

                    <input
                        type="text"
                        id="ipAddress"
                        name="ip_address"
                        placeholder="Enter your IP address"
                        autocomplete="off"
                        required
                    >

                </div>

                <button type="submit" id="uploadButton">
                    Upload IP
                </button>

            </form>

            <div id="message" class="message"></div>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
