<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Your IP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="upload-card">
            <h2>📍 Upload Your IP</h2>
            
            <form id="uploadForm">
                <input
                    type="text"
                    id="ipInput"
                    class="input-field"
                    placeholder="Enter IP address (e.g., 8.8.8.8)"
                    required
                >
                <button type="submit" id="uploadBtn" class="btn-upload">
                    <span class="btn-text">Upload IP</span>
                    <span class="btn-loader"></span>
                </button>
            </form>

            <div id="uploadNotification" class="notification"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
